[ build-system ]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[ project ]
name = "pyblnet-async"
version = "0.1.1"
description = "Async client for the Technische Alternative BL-NET (UVR1611)"
readme = "README.md"
readme-content-type = "text/markdown"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "nielstron", email = "n.muendler@posteo.de"}
]
keywords = ["python", "uvr1611", "blnet", "technische alternative", "home automation", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
]

[ project.urls ]
"Homepage" = "https://github.com/volkerfrank73/pyblnet-async"
"Upstream" = "https://github.com/nielstron/pyblnet/"

[ tool.flit.module ]
name = "pyblnet_async"

[ tool.pytest.ini_options ]
asyncio_mode = "auto"
