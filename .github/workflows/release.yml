name: Python package
# Manual only: publishing to PyPI needs the PYPI_TOKEN secret and a decision to release.
on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # If there isn't a release for this version, create a new one.
      - uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          makeLatest: true
          prerelease: false
          skipIfReleaseExists: true

      - name: To PyPI using Flit
        uses: AsifArmanRahman/to-pypi-using-flit@v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}